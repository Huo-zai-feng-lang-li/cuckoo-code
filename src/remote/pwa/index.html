<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="color-scheme" content="light dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>Cuckoo Remote</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 图标精灵：全站统一单线图标（stroke=currentColor），替代 emoji -->
  <svg class="icon-sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <symbol id="i-bird" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15.2 4.1a5.2 5.2 0 0 1 4.6 3.6" />
      <path d="M19.8 7.7 22.4 6.6 19.8 5.5" />
      <path d="M15.2 4.1c-2.9 0-5.3 2.2-5.5 5.1C6.2 9.6 3.5 12.5 3.5 16c0 2.4 2 4.4 4.4 4.4h6.5c3.6 0 6.5-2.9 6.5-6.5 0-1.7-.6-3.2-1.7-4.4" />
      <circle cx="16.1" cy="7.5" r="0.95" fill="currentColor" stroke="none" />
      <path d="M9.6 20.4V18.6M12.9 20.4V18.6" />
      <path d="M4.6 19.9 2.4 21.9" />
    </symbol>
    <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3v18h18" />
      <path d="m7 15 4-4 3 3 5-6" />
    </symbol>
    <symbol id="i-flask" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 3h6" />
      <path d="M10 3v6l-5.2 8.3A2 2 0 0 0 6.5 21h11a2 2 0 0 0 1.7-3.7L14 9V3" />
    </symbol>
    <symbol id="i-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
      <path d="M14 3v5h5" />
      <path d="M9 13h6M9 17h4" />
    </symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 2 4.5 13.5a.6.6 0 0 0 .5 1H11l-1 7.5 8.5-11.5a.6.6 0 0 0-.5-1H12z" />
    </symbol>
    <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
    </symbol>
    <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10" />
      <path d="M12 16v-4M12 8h.01" />
    </symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="14" rx="2" />
      <path d="M8 21h8M12 17v4" />
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5" />
      <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" />
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6" />
    </symbol>
    <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5" /><path d="m5 12 7-7 7 7" />
    </symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14" /><path d="m19 12-7 7-7-7" />
    </symbol>
  </svg>

  <!-- 断线横幅 -->
  <div id="offline-banner" class="offline-banner">
    <div class="offline-inner">
      <span class="offline-dot"></span>
      <span id="offline-text">连接已断开，正在自动重连…</span>
    </div>
  </div>

  <!-- 登录层 -->
  <div id="login" class="login">
    <div class="login-card">
      <div class="login-logo-wrap">
        <span class="login-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bird" /></svg></span>
      </div>
      <div class="login-badge">
        <span class="login-badge-dot"></span>
        <span>端到端安全直连</span>
      </div>
      <h1 class="login-title">Cuckoo Remote</h1>
      <p class="login-sub">手机远程控制工作台</p>

      <div class="token-input-group" id="server-group">
        <svg class="token-icon" width="18" height="18" aria-hidden="true"><use href="#i-monitor" /></svg>
        <input id="server-input" type="text" placeholder="电脑端地址（如 http://192.168.1.5:7788）" autocomplete="off" autocapitalize="off" spellcheck="false" />
      </div>

      <button id="btn-scan" type="button" style="display:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><path d="M3 9h18"></path><path d="M9 21V9"></path></svg>
        扫码连接电脑
      </button>

      <div class="token-input-group">
        <svg class="token-icon" width="18" height="18" aria-hidden="true"><use href="#i-lock" /></svg>
        <input id="token-input" type="text" placeholder="输入 32 位访问令牌" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button id="token-paste-btn" class="token-paste-btn" type="button" title="从剪贴板粘贴">粘贴</button>
      </div>

      <button id="token-btn" class="token-btn">连接工作台</button>
      <div id="login-err" class="login-err"></div>

      <div class="login-tip-box">
        <svg width="15" height="15" aria-hidden="true"><use href="#i-info" /></svg>
        <span>在电脑端「远程控制」面板点击<strong>『复制手机直达链接』</strong>发给微信并在手机打开，即可自动免密直达。</span>
      </div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand-badge">
          <span class="brand-logo"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bird" /></svg></span>
          <span class="brand-name">Cuckoo</span>
        </div>
        <div class="status-pill" id="status-pill">
          <span class="dot" id="conn-dot"></span>
          <span class="status-text" id="conn-text">连接中</span>
        </div>
        <div class="profile-pill-wrap" title="切换控制窗口">
          <svg class="profile-icon" width="13" height="13" aria-hidden="true"><use href="#i-monitor" /></svg>
          <span class="profile-label" id="profile-label">默认窗口</span>
          <svg class="chevron-icon" width="11" height="11" aria-hidden="true"><use href="#i-chevron" /></svg>
          <select id="profile-select" class="profile-select" aria-label="切换控制窗口"></select>
        </div>
      </div>
      <div class="topbar-right">
        <button id="btn-clear" class="icon-btn" title="清空屏幕消息" aria-label="清空屏幕消息">
          <svg width="18" height="18" aria-hidden="true"><use href="#i-trash" /></svg>
        </button>
        <button id="btn-theme" class="icon-btn" title="切换主题" aria-label="切换主题">
          <svg class="theme-icon-light" width="18" height="18" aria-hidden="true"><use href="#i-sun" /></svg>
          <svg class="theme-icon-dark" width="18" height="18" aria-hidden="true"><use href="#i-moon" /></svg>
        </button>
        <button id="btn-reconnect" class="icon-btn" title="重连" aria-label="重连">
          <svg width="18" height="18" aria-hidden="true"><use href="#i-refresh" /></svg>
        </button>
      </div>
    </header>

    <main id="messages" class="messages">
      <!-- 空状态引导卡片 -->
      <div id="empty-state" class="empty-state">
        <div class="empty-icon-wrap">
          <span class="empty-avatar"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bird" /></svg></span>
          <div class="empty-ring"></div>
        </div>
        <h2 class="empty-title">Cuckoo Remote 已就绪</h2>
        <p class="empty-desc">已与电脑端建立低延迟安全直连。随时在手机上发送指令、控制电脑、查看实时生成并随时中断。</p>

        <div class="quick-prompts-card">
          <div class="quick-prompts-label">快捷指令推荐</div>
          <div class="quick-prompts">
            <button class="quick-chip" type="button" data-prompt="检查当前项目的 Git 状态和代码改动">
              <span class="chip-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chart" /></svg></span>
              <span class="chip-text">检查 Git 改动</span>
            </button>
            <button class="quick-chip" type="button" data-prompt="运行项目测试套件并汇报结果">
              <span class="chip-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-flask" /></svg></span>
              <span class="chip-text">运行测试</span>
            </button>
            <button class="quick-chip" type="button" data-prompt="总结当前任务进展及下一步计划">
              <span class="chip-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-note" /></svg></span>
              <span class="chip-text">汇报任务进度</span>
            </button>
            <button class="quick-chip" type="button" data-prompt="继续执行当前计划的下一步">
              <span class="chip-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bolt" /></svg></span>
              <span class="chip-text">执行下一步</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- 浮动执行状态胶囊 -->
    <div id="exec-status" class="exec-status hidden">
      <div class="exec-pill">
        <span class="exec-waves">
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
        </span>
        <span id="exec-text">正在生成回复…</span>
      </div>
    </div>

    <!-- 回到底部悬浮 FAB -->
    <button id="scroll-bottom-btn" class="scroll-bottom-btn hidden" aria-label="回到最新" title="回到最新">
      <svg width="18" height="18" aria-hidden="true"><use href="#i-arrow-down" /></svg>
      <span id="scroll-new-badge" class="scroll-new-badge hidden"></span>
    </button>

    <footer class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="给电脑端发指令…" autocomplete="off"></textarea>
        <button id="send" class="send-btn" aria-label="发送" title="发送">
          <svg width="18" height="18" aria-hidden="true"><use href="#i-up" /></svg>
        </button>
        <button id="stop" class="stop-btn hidden" aria-label="停止执行" title="停止执行">
          <span class="stop-box"></span>
        </button>
      </div>
    </footer>
  </div>

  <script src="/marked.umd.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
