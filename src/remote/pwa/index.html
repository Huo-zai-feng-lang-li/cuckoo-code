<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>Cuckoo Remote</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 断线横幅 -->
  <div id="offline-banner" class="offline-banner">
    <div class="offline-inner">
      <span class="offline-dot"></span>
      <span id="offline-text">连接已断开，正在自动重连…</span>
    </div>
  </div>

  <!-- 登录层 -->
  <div id="login" class="login">
    <div class="login-card">
      <div class="login-logo-wrap">
        <div class="login-logo">🦜</div>
        <div class="login-glow"></div>
      </div>
      <div class="login-badge">
        <span class="login-badge-dot"></span>
        <span>端到端安全直连</span>
      </div>
      <h1 class="login-title">Cuckoo Remote</h1>
      <p class="login-sub">手机远程控制工作台</p>

      <div class="token-input-group">
        <svg class="token-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="token-input" type="text" placeholder="输入 32 位访问令牌" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button id="token-paste-btn" class="token-paste-btn" type="button" title="从剪贴板粘贴">粘贴</button>
      </div>

      <button id="token-btn" class="token-btn">连接工作台</button>
      <div id="login-err" class="login-err"></div>

      <div class="login-tip-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span>在电脑端「远程控制」面板点击<strong>『复制手机直达链接』</strong>发给微信并在手机打开，即可自动免密直达。</span>
      </div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand-badge">
          <span class="brand-logo">🦜</span>
          <span class="brand-name">Cuckoo</span>
        </div>
        <div class="status-pill" id="status-pill">
          <span class="dot" id="conn-dot"></span>
          <span class="status-text" id="conn-text">连接中</span>
        </div>
        <div class="profile-pill-wrap" title="切换控制窗口">
          <svg class="profile-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          <span class="profile-label" id="profile-label">默认窗口</span>
          <svg class="chevron-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          <select id="profile-select" class="profile-select" aria-label="切换控制窗口"></select>
        </div>
      </div>
      <div class="topbar-right">
        <button id="btn-clear" class="icon-btn" title="清空屏幕消息" aria-label="清空屏幕消息">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        </button>
        <button id="btn-theme" class="icon-btn" title="切换主题" aria-label="切换主题">
          <svg class="theme-icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
          <svg class="theme-icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button id="btn-reconnect" class="icon-btn" title="重连" aria-label="重连">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </header>

    <main id="messages" class="messages">
      <!-- 空状态引导卡片 -->
      <div id="empty-state" class="empty-state">
        <div class="empty-icon-wrap">
          <div class="empty-avatar">🦜</div>
          <div class="empty-ring"></div>
        </div>
        <h2 class="empty-title">Cuckoo Remote 已就绪</h2>
        <p class="empty-desc">已与电脑端建立低延迟安全直连。随时在手机上发送指令、控制电脑、查看实时生成并随时中断。</p>

        <div class="quick-prompts-card">
          <div class="quick-prompts-label">快捷指令推荐</div>
          <div class="quick-prompts">
            <button class="quick-chip" type="button" data-prompt="检查当前项目的 Git 状态和代码改动">
              <span class="chip-icon">📊</span>
              <span class="chip-text">检查 Git 改动</span>
            </button>
            <button class="quick-chip" type="button" data-prompt="运行项目测试套件并汇报结果">
              <span class="chip-icon">🧪</span>
              <span class="chip-text">运行测试</span>
            </button>
            <button class="quick-chip" type="button" data-prompt="总结当前任务进展及下一步计划">
              <span class="chip-icon">📝</span>
              <span class="chip-text">汇报任务进度</span>
            </button>
            <button class="quick-chip" type="button" data-prompt="继续执行当前计划的下一步">
              <span class="chip-icon">⚡</span>
              <span class="chip-text">执行下一步</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- 浮动执行状态胶囊 -->
    <div id="exec-status" class="exec-status hidden">
      <div class="exec-pill">
        <span class="exec-waves">
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
        </span>
        <span id="exec-text">正在生成回复…</span>
      </div>
    </div>

    <!-- 回到底部悬浮 FAB -->
    <button id="scroll-bottom-btn" class="scroll-bottom-btn hidden" aria-label="回到最新" title="回到最新">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
      <span id="scroll-new-badge" class="scroll-new-badge hidden"></span>
    </button>

    <footer class="composer">
      <div class="composer-inner">
        <label id="attach" class="attach-btn" aria-label="上传图片" title="上传图片">
          <input id="file-input" type="file" accept="image/*" />
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </label>
        <textarea id="input" rows="1" placeholder="给电脑端发指令…" autocomplete="off"></textarea>
        <button id="send" class="send-btn" aria-label="发送" title="发送">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
        <button id="stop" class="stop-btn hidden" aria-label="停止执行" title="停止执行">
          <span class="stop-box"></span>
        </button>
      </div>
    </footer>
  </div>

  <script src="/marked.umd.js"></script>
  <script src="/app.js"></script>
</body>
</html>
