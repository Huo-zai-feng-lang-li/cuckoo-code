<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="light dark" />
<title>确认</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --border: rgba(16, 24, 40, 0.08);
    --text: #16181d;
    --text-2: #545a67;
    --text-dim: #8a8f9b;
    --success: #2f9e6b;
    --success-soft: rgba(47, 158, 107, 0.10);
    --info: #4d6bfe;
    --info-soft: rgba(77, 107, 254, 0.10);
    --warn: #e6a23c;
    --warn-soft: rgba(230, 162, 60, 0.10);
    --danger: #e5484d;
    --danger-soft: rgba(229, 72, 77, 0.10);
    --primary-hover: #3b5bdb;
    --surface: #f5f6f8;
    --surface-hover: #eef0f4;
    --shadow: 0 12px 40px rgba(16, 24, 40, 0.18), 0 2px 8px rgba(16, 24, 40, 0.08);
    --accent: var(--info);
    --accent-soft: var(--info-soft);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --border: rgba(255, 255, 255, 0.10);
      --text: #eef1f6;
      --text-2: #c0c6d2;
      --text-dim: #8a90a0;
      --success: #4ecb8d;
      --success-soft: rgba(78, 203, 141, 0.14);
      --info: #7b8fff;
      --info-soft: rgba(123, 143, 255, 0.16);
      --warn: #f0b95a;
      --warn-soft: rgba(240, 185, 90, 0.14);
      --danger: #ff6369;
      --danger-soft: rgba(255, 99, 105, 0.14);
      --primary-hover: #9aa9ff;
      --surface: rgba(255, 255, 255, 0.05);
      --surface-hover: rgba(255, 255, 255, 0.09);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.3);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
  }

  .card {
    width: 100%; height: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    padding: 16px 18px 14px;
    animation: slideIn .24s cubic-bezier(.22, .61, .36, 1);
    overflow: hidden;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }
  .icon-wrap {
    width: 32px; height: 32px;
    border-radius: 9px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-wrap svg { width: 18px; height: 18px; }

  .head-text { flex: 1; min-width: 0; padding-top: 2px; }
  .title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
    letter-spacing: -.01em;
  }
  .body {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.5;
    margin-top: 4px;
  }
  .body:empty { display: none; }

  .close {
    width: 24px; height: 24px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .15s, color .15s;
  }
  .close:hover { background: var(--surface-hover); color: var(--text); }
  .close svg { width: 14px; height: 14px; }

  .detail {
    flex: 1;
    min-height: 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-dim);
    background: var(--surface);
    border-radius: 9px;
    padding: 8px 10px;
    margin-bottom: 12px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: "SF Mono", "Consolas", "Menlo", monospace;
  }
  .detail:empty { display: none; }

  .foot {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: auto;
  }

  .btn {
    height: 34px;
    padding: 0 16px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background .15s, border-color .15s, color .15s, transform .08s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:active { transform: scale(.97); }

  .btn-secondary {
    background: var(--bg);
    border-color: var(--border);
    color: var(--text-2);
  }
  .btn-secondary:hover { background: var(--surface-hover); color: var(--text); border-color: transparent; }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 12px -4px var(--accent);
  }
  .btn-primary:hover { filter: brightness(1.08); }

  /* 类型配色 */
  .card[data-kind="success"] { --accent: var(--success); --accent-soft: var(--success-soft); }
  .card[data-kind="warn"]    { --accent: var(--warn);    --accent-soft: var(--warn-soft); }
  .card[data-kind="error"]   { --accent: var(--danger);  --accent-soft: var(--danger-soft); }
  .card[data-kind="info"]    { --accent: var(--info);    --accent-soft: var(--info-soft); }
</style>
</head>
<body>
  <div class="card" id="card" data-kind="info">
    <div class="head">
      <div class="icon-wrap" id="icon"></div>
      <div class="head-text">
        <div class="title" id="title">确认</div>
        <div class="body" id="body"></div>
      </div>
      <button class="close" id="btn-close" aria-label="关闭" title="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="detail" id="detail"></div>
    <div class="foot">
      <button class="btn btn-secondary" id="btn-secondary">稍后</button>
      <button class="btn btn-primary" id="btn-primary">确定</button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';
      var api = window.confirmAPI;
      var card = document.getElementById('card');
      var elIcon = document.getElementById('icon');
      var elTitle = document.getElementById('title');
      var elBody = document.getElementById('body');
      var elDetail = document.getElementById('detail');
      var btnPrimary = document.getElementById('btn-primary');
      var btnSecondary = document.getElementById('btn-secondary');
      var btnClose = document.getElementById('btn-close');

      var ICONS = {
        success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
        info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
        warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
        error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
      };

      function act(action) {
        try { api && api.action(action); } catch (_) {}
      }

      btnPrimary.addEventListener('click', function () { act('primary'); });
      btnSecondary.addEventListener('click', function () { act('secondary'); });
      btnClose.addEventListener('click', function () { act('secondary'); });
      document.addEventListener('keydown', function (e) {
        // Esc 视为取消（保守）；Enter 触发主按钮（默认动作）
        if (e.key === 'Escape') act('secondary');
        else if (e.key === 'Enter') act('primary');
      });

      if (api && api.onInit) {
        api.onInit(function (data) {
          if (!data) return;
          var kind = data.kind || 'info';
          card.setAttribute('data-kind', kind);
          elIcon.innerHTML = ICONS[kind] || ICONS.info;
          elTitle.textContent = data.title || '';
          elBody.textContent = data.body || '';
          elDetail.textContent = data.detail || '';
          btnPrimary.textContent = data.primaryText || '确定';
          if (data.secondaryText) {
            btnSecondary.textContent = data.secondaryText;
            btnSecondary.style.display = '';
          } else {
            btnSecondary.style.display = 'none';
          }
        });
      }
    })();
  </script>
</body>
</html>
