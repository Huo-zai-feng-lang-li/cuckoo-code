            <!-- ===== 源代码管理（Git） ===== -->
            <div class="ck-tab" data-panel="git">
              <div class="ck-actions">
                <span class="ck-set-group-title" style="flex:1;">源代码管理</span>
                <button class="ck-icon-btn" id="git-refresh" title="刷新">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
                </button>
              </div>
              <div class="ck-git-branch" id="git-branch-bar">
                <svg class="ck-git-branch-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M6 15V9a3 3 0 0 1 3-3h6"/><path d="M15 18H9"/></svg>
                <span class="ck-git-branch-name" id="git-branch-name">—</span>
                <span class="ck-git-branch-caret">▾</span>
              </div>
              <div class="ck-git-branch-list ck-hidden" id="git-branch-list"></div>
              <div class="ck-git-commit">
                <textarea class="ck-textarea ck-git-msg" id="git-commit-msg" placeholder="提交信息（Ctrl+Enter 提交）" rows="2"></textarea>
                <button class="ck-btn ck-btn-primary" id="git-commit-btn" disabled>提交</button>
              </div>
              <div class="ck-list ck-git" id="git-list">
                <div class="ck-list-empty">加载中…</div>
              </div>
              <!-- 提交历史（懒加载：展开时才拉取） -->
              <div class="ck-git-history" id="git-history">
                <div class="ck-git-history-head" id="git-history-toggle">
                  <span class="ck-git-caret" id="git-history-caret"></span>
                  <span class="ck-git-history-title">提交历史</span>
                  <span class="ck-git-history-count" id="git-history-count"></span>
                </div>
                <div class="ck-git-history-list ck-hidden" id="git-history-list"></div>
              </div>
            </div>
