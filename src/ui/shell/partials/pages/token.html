            <!-- ===== Token ===== -->
            <div class="ck-tab" data-panel="token">
              <div class="ck-token-hero">
                <span class="ck-token-hero-label">本轮上下文<span class="ck-hint" data-tooltip="模型此刻能看到的全部内容（含历史），决定是否触发压缩">!</span></span>
                <div class="ck-token-hero-value">
                  <span id="tk-context">0</span>
                  <span class="ck-token-hero-unit">tokens</span>
                </div>
              </div>
              <button class="ck-btn ck-btn-anim" id="tk-compact">
                <svg class="ck-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v4M8 7H4M8 7l-4-4"/><path d="M16 21v-4M16 17h4M16 17l4 4"/><path d="M4 14h16"/></svg>
                <span>压缩上下文</span>
              </button>

              <div class="ck-stat-list">
                <div class="ck-stat-item">
                  <span class="ck-stat-key">各轮累计<span class="ck-hint" data-tooltip="各轮上下文之和（每轮都重发完整历史），非单次占用">!</span></span>
                  <span class="ck-stat-val" id="tk-cumulative">0</span>
                </div>
                <div class="ck-stat-item">
                  <span class="ck-stat-key">今日本窗口<span class="ck-hint" data-tooltip="【本窗口】今天各轮「完整上下文」之和（含重复历史），非新增内容
例：3 轮，每轮新增 500
第1轮 500 → 第2轮 1000 → 第3轮 1500
合计 3000（不是新增的 1500）">!</span></span>
                  <span class="ck-stat-val" id="tk-today">0</span>
                </div>
                <div class="ck-stat-item ck-stat-item-hl">
                  <span class="ck-stat-key">今日全窗口<span class="ck-hint" data-tooltip="【所有窗口】今天各轮完整上下文之和（全局今日消耗）">!</span></span>
                  <span class="ck-stat-val" id="tk-today-total">0</span>
                </div>
                <div class="ck-stat-item ck-stat-item-hl">
                  <span class="ck-stat-key">预估费用<span class="ck-hint" id="tk-cost-hint" data-tooltip="基于「今日全窗口」粗略估算，非精确账单
假设：输出占 15%，输入缓存命中 70%
单价(元/百万)：命中 0.02 / 未命中 1 / 输出 4
高峰时段(工作日 9-12、14-18)价格翻倍">!</span></span>
                  <span class="ck-stat-val" id="tk-cost">—</span>
                </div>
                <div class="ck-stat-item">
                  <span class="ck-stat-key">本窗口历史累计<span class="ck-hint" data-tooltip="本窗口所有会话（含历史）的各轮累计之和">!</span></span>
                  <span class="ck-stat-val" id="tk-window">0</span>
                </div>
                <div class="ck-stat-item">
                  <span class="ck-stat-key">系统总累计<span class="ck-hint" data-tooltip="所有窗口历史累计总和">!</span></span>
                  <span class="ck-stat-val" id="tk-system">0</span>
                </div>
              </div>

              <div class="ck-auto-grid">
                <div class="ck-auto-block">
                  <div class="ck-auto-head">
                    <span class="ck-stat-key">自动压缩<span class="ck-hint" data-tooltip="当前上下文超过阈值时，自动向模型发送指令压缩上下文并开启新会话">!</span></span>
                    <label class="ck-switch">
                      <input type="checkbox" id="tk-auto-enabled" aria-label="自动压缩" />
                      <span class="ck-switch-track"></span>
                    </label>
                  </div>
                  <div class="ck-auto-body">
                    <div class="ck-auto-rule">
                      <span>超过</span>
                      <input type="number" id="tk-auto-threshold" value="80" min="0.01" step="0.01" aria-label="自动压缩阈值（万 tokens）" />
                      <span>万 tokens 时触发</span>
                    </div>
                    <button class="ck-auto-save-btn" id="tk-auto-save">保存</button>
                  </div>
                </div>

                <div class="ck-auto-block">
                  <div class="ck-auto-head">
                    <span class="ck-stat-key">上下文切换窗口<span class="ck-hint" data-tooltip="当前上下文达到阈值时，自动平滑轮换切换到下一个可用窗口">!</span></span>
                    <label class="ck-switch">
                      <input type="checkbox" id="tk-switch-enabled" aria-label="上下文达到阈值自动切换窗口" />
                      <span class="ck-switch-track"></span>
                    </label>
                  </div>
                  <div class="ck-auto-body">
                    <div class="ck-auto-rule">
                      <span>达到</span>
                      <input type="number" id="tk-switch-threshold" value="10" min="0.01" step="0.01" aria-label="切换窗口阈值（万 tokens）" />
                      <span>万 tokens 时切换</span>
                    </div>
                    <button class="ck-auto-save-btn" id="tk-switch-save">保存</button>
                  </div>
                </div>
              </div>

              <div class="ck-chart-block">
                <div class="ck-chart" id="tk-chart"></div>
              </div>
            </div>
