            <!-- ===== 任务（命令 / scripts） ===== -->
            <div class="ck-tab" data-panel="tasks">
              <div class="ck-actions">
                <span class="ck-set-group-title" style="flex:1;">任务</span>
                <button class="ck-icon-btn" id="task-clear" title="清空已结束">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                </button>
                <button class="ck-icon-btn" id="task-refresh" title="刷新">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
                </button>
              </div>

              <!-- 手动输入命令 -->
              <div class="ck-task-input">
                <input class="ck-input" id="task-cmd-input" placeholder="输入命令，回车运行（后台）" />
                <button class="ck-btn ck-btn-primary" id="task-run-btn">运行</button>
              </div>

              <!-- package.json scripts -->
              <div class="ck-task-scripts-head" id="task-scripts-head">
                <span class="ck-git-caret ck-git-caret-c" id="task-scripts-caret"></span>
                <span class="ck-task-scripts-title">package.json 脚本</span>
                <span class="ck-task-scripts-count" id="task-scripts-count"></span>
              </div>
              <div class="ck-task-scripts cuckoo-hidden" id="task-scripts"></div>

              <!-- 运行中的任务 -->
              <div class="ck-task-list-head">
                <span class="ck-task-list-title">任务列表</span>
              </div>
              <div class="ck-list ck-task-list" id="task-list">
                <div class="ck-list-empty">暂无任务</div>
              </div>
            </div>
