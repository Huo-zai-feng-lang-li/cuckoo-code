          <div class="ck-modal-mask cuckoo-hidden" id="snip-modal">
            <div class="ck-modal">
              <span class="ck-modal-title" id="snip-modal-title">编辑提示词</span>
              <div class="ck-field">
                <span class="ck-field-label">名称</span>
                <input class="ck-input" id="snip-name" placeholder="如：生成项目说明" />
              </div>
              <div class="ck-field">
                <span class="ck-field-label">内容</span>
                <textarea class="ck-textarea" id="snip-content" placeholder="点击后将填入输入框的文本"></textarea>
              </div>
              <div class="ck-auto-head">
                <span class="ck-field-label">自动发送</span>
                <label class="ck-switch">
                  <input type="checkbox" id="snip-autosend" checked />
                  <span class="ck-switch-track"></span>
                </label>
              </div>
              <div class="ck-modal-foot">
                <button class="ck-btn ck-btn-secondary" id="snip-cancel">取消</button>
                <button class="ck-btn ck-btn-primary" id="snip-save">保存</button>
              </div>
            </div>
          </div>
          <!-- 新建/编辑子代理弹窗 -->
          <div class="ck-modal-mask cuckoo-hidden" id="agent-modal">
            <div class="ck-modal">
              <span class="ck-modal-title" id="agent-modal-title">新建子代理</span>
              <div class="ck-field">
                <span class="ck-field-label">名称</span>
                <input class="ck-input" id="agent-name" placeholder="如：code-reviewer（英文）" />
              </div>
              <div class="ck-field" id="agent-scope-field">
                <span class="ck-field-label">位置</span>
                <select class="ck-input" id="agent-scope">
                  <option value="project">项目级（.cuckoo/agents/）</option>
                  <option value="user">用户级（~/.cuckoo/agents/）</option>
                </select>
              </div>
              <p class="ck-about-tip" id="agent-modal-tip">生成模板后，会用系统默认程序打开，你直接编辑保存即可。</p>
              <div class="ck-modal-foot">
                <button class="ck-btn ck-btn-secondary cuckoo-hidden" id="agent-open-file">打开正文</button>
                <button class="ck-btn ck-btn-secondary" id="agent-cancel">取消</button>
                <button class="ck-btn ck-btn-primary" id="agent-create">创建并打开</button>
              </div>
            </div>
          </div>
          <!-- 窗口组管理弹窗 -->
          <div class="ck-modal-mask cuckoo-hidden" id="wg-modal">
            <div class="ck-modal">
              <span class="ck-modal-title">管理窗口组</span>
              <div class="ck-field">
                <span class="ck-field-label">组名</span>
                <input class="ck-input" id="wg-modal-name" placeholder="组名" />
              </div>
              <div class="ck-field">
                <span class="ck-field-label">组内窗口（按顺序轮换）</span>
                <div class="ck-wg-members" id="wg-modal-members"></div>
              </div>
              <div class="ck-field" id="wg-modal-add-wrap">
                <span class="ck-field-label">添加窗口</span>
                <select class="ck-input" id="wg-modal-add"></select>
              </div>
              <div class="ck-modal-foot">
                <button class="ck-btn ck-btn-secondary" id="wg-modal-cancel">取消</button>
                <button class="ck-btn ck-btn-primary" id="wg-modal-save">保存</button>
              </div>
            </div>
          </div>
          <!-- 窗口代理/指纹弹窗 -->
          <div class="ck-modal-mask cuckoo-hidden" id="proxy-modal">
            <div class="ck-modal">
              <span class="ck-modal-title">窗口网络身份</span>
              <div class="ck-field">
                <span class="ck-field-label">启用</span>
                <label class="ck-switch">
                  <input type="checkbox" id="proxy-enabled" />
                  <span class="ck-switch-track"></span>
                </label>
              </div>
              <div class="ck-field">
                <span class="ck-field-label">代理地址</span>
                <input class="ck-input" id="proxy-rules" placeholder="http://127.0.0.1:41576 或 socks5h://127.0.0.1:1080" />
              </div>
              <div class="ck-field">
                <span class="ck-field-label">绕过规则（逗号分隔）</span>
                <input class="ck-input" id="proxy-bypass" placeholder="<local>,localhost,127.0.0.1" />
              </div>
              <div class="ck-auto-head">
                <span class="ck-field-label">自动跟随出口 IP（时区/语言/经纬度）</span>
                <label class="ck-switch">
                  <input type="checkbox" id="proxy-autogeo" checked />
                  <span class="ck-switch-track"></span>
                </label>
              </div>
              <div class="ck-field">
                <span class="ck-field-label">WebRTC 策略</span>
                <select class="ck-input" id="proxy-webrtc">
                  <option value="spoof">伪装（推荐，只暴露 mDNS 虚拟地址，防 DNS/IP 泄露）</option>
                  <option value="disable">彻底禁用（阻止所有 WebRTC 通信）</option>
                  <option value="off">关闭（保留原生，可能泄露真实 IP）</option>
                </select>
              </div>
              <details class="ck-proxy-advanced">
                <summary>高级（手动覆盖自动探测值，留空则用探测结果）</summary>
                <div class="ck-field">
                  <span class="ck-field-label">时区（IANA，如 America/Los_Angeles）</span>
                  <input class="ck-input" id="proxy-timezone" placeholder="America/Los_Angeles" />
                </div>
                <div class="ck-field">
                  <span class="ck-field-label">语言（BCP47，如 en-US）</span>
                  <input class="ck-input" id="proxy-locale" placeholder="en-US" />
                </div>
                <div class="ck-field">
                  <span class="ck-field-label">纬度</span>
                  <input class="ck-input" id="proxy-latitude" placeholder="34.0522" />
                </div>
                <div class="ck-field">
                  <span class="ck-field-label">经度</span>
                  <input class="ck-input" id="proxy-longitude" placeholder="-118.2437" />
                </div>
              </details>
              <div class="ck-modal-foot">
                <button class="ck-btn ck-btn-secondary" id="proxy-modal-cancel">取消</button>
                <button class="ck-btn ck-btn-primary" id="proxy-modal-save">保存</button>
              </div>
            </div>
          </div>
          <!-- 通用输入弹窗（重命名会话等） -->
          <div class="ck-modal-mask cuckoo-hidden" id="input-modal">
            <div class="ck-modal">

              </div>
              <div class="ck-modal-foot">
                <button class="ck-btn ck-btn-secondary" id="input-modal-cancel">取消</button>
                <button class="ck-btn ck-btn-primary" id="input-modal-ok">确定</button>
              </div>
            </div>
          </div>
          <!-- 通用弹框（替代原生 alert/confirm） -->
          <div class="ck-modal-mask cuckoo-hidden" id="ck-dialog">
            <div class="ck-modal ck-dialog">
              <span class="ck-modal-title" id="ck-dialog-title">提示</span>
              <div class="ck-dialog-msg" id="ck-dialog-msg"></div>
              <div class="ck-modal-foot">
                <button class="ck-btn ck-btn-secondary cuckoo-hidden" id="ck-dialog-alt">查看差异</button>
                <button class="ck-btn ck-btn-secondary cuckoo-hidden" id="ck-dialog-cancel">取消</button>
                <button class="ck-btn ck-btn-primary" id="ck-dialog-ok">确定</button>
              </div>
            </div>
          </div>
          <!-- 提交详情（diff）弹框 -->
          <div class="ck-modal-mask cuckoo-hidden" id="git-diff-modal">
            <div class="ck-modal ck-git-diff-modal">
              <span class="ck-modal-title" id="git-diff-title">提交详情</span>
              <div class="ck-git-diff-body" id="git-diff-body"></div>
              <button class="ck-diff-totop cuckoo-hidden" id="git-diff-totop" title="回到顶部">↑ 顶部</button>
              <div class="ck-modal-foot">
                <button class="ck-btn ck-btn-secondary" id="git-diff-copy">复制 diff</button>
                <button class="ck-btn ck-btn-primary" id="git-diff-close">关闭</button>
              </div>
            </div>
          </div>
