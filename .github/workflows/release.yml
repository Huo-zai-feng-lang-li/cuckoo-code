name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            command: build:win:local
          - os: macos-latest
            command: build:mac:local
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Sync version from tag
        run: node scripts/sync-version.js
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Install dependencies
        run: npm ci

      - name: Cache runtime binaries
        uses: actions/cache@v4
        with:
          path: resources/runtime
          key: runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/runtime-versions.json') }}

      - name: Fetch runtime binaries
        run: node scripts/fetch-runtime.mjs

      - name: Build
        run: npm run ${{ matrix.command }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.zip
            dist/*.dmg
            dist/latest*.yml
          retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Sync version from tag
        run: node scripts/sync-version.js
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 10.0
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/cuckoo-remote-android.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/cuckoo-remote-android.apk
          retention-days: 30

  publish:
    needs: [build, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -la dist/

      - name: Publish Release
        if: ${{ !contains(github.ref_name, '-beta') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          make_latest: true
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/*.zip
            dist/*.dmg
            dist/latest*.yml
            dist/*.apk
