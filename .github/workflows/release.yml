name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Sync version from tag
        run: node scripts/sync-version.js
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Install dependencies
        run: npm ci
      - name: Fetch runtime binaries
        run: node scripts/fetch-runtime.mjs
      - name: Build
        run: npm run build:win:local
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-win
          path: |
            dist/*.exe
            dist/latest*.yml
          retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Sync version from tag
        run: node scripts/sync-version.js
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Install dependencies
        run: npm ci

      # 关键：必须先 compile，生成 out/src/remote/pwa，否则 cap sync 报 Could not find web assets directory
      - name: Compile (generate PWA assets)
        run: npm run compile

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (using preinstalled on runner)
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/cmdline-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Show Gradle Log
        if: always()
        run: |
          cd android
          echo "====== LAST 200 LINES ======"
          tail -n 200 gradle-build.log || true
          echo "====== ERROR LINES ======"
          grep -i -E "error|fail|exception|What went wrong|Caused by" gradle-build.log | head -n 100 || true
          {
            echo "### Gradle Build Log (last 200 lines)"
            echo ""
            echo '```'
            tail -n 200 gradle-build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rename APK
        if: success()
        run: |
          cd android/app/build/outputs/apk/debug
          mv app-debug.apk cuckoo-remote-android-${{ github.ref_name }}.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: android/app/build/outputs/apk/debug/cuckoo-remote-android-*.apk
          if-no-files-found: warn

      # 无论成功失败，都把 Gradle 完整日志传上来
      - name: Upload Gradle Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle-build.log
          if-no-files-found: warn

  publish:
    needs: [build-win, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish Release
        if: ${{ !contains(github.ref_name, '-beta') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          make_latest: true
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/latest*.yml
            dist/*.apk
